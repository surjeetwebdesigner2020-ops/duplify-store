services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: duplify
      POSTGRES_PASSWORD: duplify
      POSTGRES_DB: duplify_store
    ports:
      - "5432:5432"
    volumes:
      - duplify-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duplify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web and worker run via `npm run dev` / `npm run worker` locally instead of
  # these two — they're here mainly as a template for how the two Railway (or
  # any container-based) deployments should be split. Uncomment to run the
  # full stack in Docker instead of the Shopify CLI's dev server.
  # web:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile
  #   env_file: .env
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #
  # worker:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.worker
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  duplify-postgres-data:
