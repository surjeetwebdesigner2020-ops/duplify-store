# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "23ab0fd6f5d07f346529251e7bf66b3b"
name = "store duplicate"
application_url = "https://duplify-store-production-e129.up.railway.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Keep in sync with REQUESTED_SCOPES in app/lib/shopify/scopes.ts.
scopes = "read_content,read_customers,read_discounts,read_draft_orders,read_files,read_inventory,read_locations,read_metaobject_definitions,read_metaobjects,read_online_store_navigation,read_orders,read_products,read_themes,write_content,write_customers,write_discounts,write_draft_orders,write_files,write_inventory,write_metaobject_definitions,write_metaobjects,write_online_store_navigation,write_orders,write_products,write_themes"

[auth]
redirect_urls = [
  "https://duplify-store-production-e129.up.railway.app/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]

[build]
automatically_update_urls_on_dev = false
