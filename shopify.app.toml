# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9d1cb76c3edf8db57b410e2d75268a14"
name = "Duplify Store"
application_url = "https://duplify-store-production-2812.up.railway.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Keep in sync with REQUESTED_SCOPES in app/lib/shopify/scopes.ts
# read_all_orders stays in scopes.ts but is omitted here until Shopify Partner
# approval is granted (CLI rejects publishing it otherwise).
scopes = "read_content,read_customers,read_discounts,read_draft_orders,read_files,read_inventory,read_locations,read_metaobject_definitions,read_metaobjects,read_online_store_navigation,read_orders,read_products,read_themes,write_content,write_customers,write_discounts,write_draft_orders,write_files,write_inventory,write_metaobject_definitions,write_metaobjects,write_online_store_navigation,write_orders,write_products,write_themes"

[auth]
# OAuth approval links return to the same /auth/callback route used by the
# app's Shopify authentication flow.
redirect_urls = [
  "https://duplify-store-production-2812.up.railway.app/auth/callback"
]

[webhooks]
api_version = "2026-07"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # Mandatory privacy-law webhooks. HMAC verification and processing are
  # handled by /app/routes/webhooks.compliance.tsx.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]

[build]
# Keep production OAuth allow-list stable. Turning this on lets local
# `shopify app dev` overwrite Railway redirect URLs and breaks source approval.
automatically_update_urls_on_dev = false
